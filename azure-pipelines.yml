trigger:
- main

variables:
  buildConfiguration: 'Release'

stages:

# -------------------
# BUILD STAGE
# -------------------
- stage: Build
  displayName: "Build Stage"

  jobs:
  - job: BuildJob
    displayName: "Build Application"

    pool:
      name: Default   # your self-hosted agent pool

    steps:
    - checkout: self

    - script: |
        echo "Starting build on RHEL agent..."
        echo "Agent Name: $(Agent.Name)"
        echo "OS: $(Agent.OS)"
        mkdir -p $(Build.ArtifactStagingDirectory)
        echo "Hello from RHEL pipeline" > $(Build.ArtifactStagingDirectory)/hello.txt
      displayName: "Create Sample Artifact"

    - publish: $(Build.ArtifactStagingDirectory)
      artifact: drop

# -------------------
# DEPLOY STAGE
# -------------------
- stage: Deploy
  displayName: "Deploy Stage"
  dependsOn: Build
  condition: succeeded()

  jobs:
  - deployment: DeployJob
    displayName: "Deploy Application"

    pool:
      name: Default   # use same RHEL agent

    environment: dev

    strategy:
      runOnce:
        deploy:
          steps:

          - download: current
            artifact: drop

          - script: |
              echo "Deploying on RHEL agent..."
              ls -l $(Pipeline.Workspace)/drop
              cat $(Pipeline.Workspace)/drop/hello.txt
            displayName: "Verify Deployment"
